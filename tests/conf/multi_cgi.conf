
server {
    listen 3000;
    location / {
	    allowed_methods GET;
        root ./var/www/;
        autoindex off;
        cgi_pass .js /usr/bin/node;
	    cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .c   ./var/www/cgi-bin/cgi;
        cgi_dir cgi-bin;
        cgi_timeout 20;
    }
}
