<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    
    <h1> Server Tester JS</h1>
    <div class="request">
        <label for="method">Method</label>
        <input type="text" id="method" placeholder="e.g GET">
         <label for="version">HTTP version</label>
        <input type="text" id="version" placeholder="e.g HTT/1.1">
        <label for="resource">URL</label>
        <input type="text" id="url" placeholder="e.g /index.html">
        <label for="headr">Headers</label>            
        <input type="text" id="header" placeholder="e.g Content-Length: 3">
        <button id="add-header">Add new header</button>
        <label for="body">Body (optional)</label>

        <textarea name="body" id="body">

        </textarea>

        <button id="show-request">See request</button>

        <div class="show-request-toggle hidden">

            <pre id="request-content">

            </pre>
            <button id="hide-request">Hide request</button>
        </div>

        <button id="send-request">Send</button>
    </div>
    <div class="response">
        <p id="response-content">Response will show here</p>
    </div>

</body>
</html>
