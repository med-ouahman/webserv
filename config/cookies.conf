
server {
	listen 3000;
	root ./var/www/;
	session_enabled on;
	session_store  cookies;
	session_timeout 1800;
	session_cookie_name TEST;

	location /counter {
		allowed_methods GET;
		autoindex off;
	}

	location /login {
		allowed_methods POST;
		client_max_body_size 100;
	}

	location / {
		root ./var/www/php;
		allowed_methods GET;
		index login.php;
	}
}

