server {
    listen 0.0.0.0:8080;
    server_name localhost;

    root ./var/www/;
    index index.html;
    client_max_body_size 1000000000;
    error_page 404 ./var/www/error_pages/404.html;

    location / {
        root ./var/www/;
        index index.html;
        allowed_methods GET;
        autoindex off;
    }

    location /post_body {
        root ./var/www/;
        allowed_methods POST;
        client_max_body_size 100;
        upload_enable on;
        upload_path ./va
    }

    location /directory {
        root ./YoupiBanane/;
        index youpi.bad_extension;
        allowed_methods GET POST;
        autoindex off;
        cgi_pass .bla ./var/www/cgi-bin/cgi_test;
        cgi_timeout 50;
    }
}
