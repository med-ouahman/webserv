# Example webserv configuration with bonus support
server {
    listen 0.0.0.0:8080;
    server_name localhost something.com;
    root ./var/www/;
    index index.html index.htm;
    client_max_body_size 2000000;
    error_page 404 ./var/www/error_pages/404.html;

    session_enabled on;
    session_cookie_name WEBSESSID;
    session_timeout 3600;
    session_store ./sessions;

    location / {
        root  ./var/www/;
        index index.html index.htm;
        allowed_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
        upload_path ./var/www/uploads;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
        cgi_dir ./var/www/cgi-bin/;
        cgi_timeout 30;
    }

    location /images {
        root ./images;
        allowed_methods GET;
        autoindex off;
    }
}
