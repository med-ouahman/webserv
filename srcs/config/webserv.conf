# Example webserv configuration with bonus support
server {
    listen 127.0.0.1:8080;
    listen 8081;
    server_name localhost example.com;
    root ./www;
    index index.html index.htm;
    client_max_body_size 2000000;
    error_page 404 ./www/error_pages/not_found_page.html;

    session_enabled on;
    session_cookie_name WEBSESSID;
    session_timeout 3600;
    session_store ./sessions;

    location / {
        root ./www;
        index index.html index.htm;
        allowed_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
        upload_path ./uploads;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
    }

    location /images {
        root ./images;
        allowed_methods GET;
        autoindex off;
    }
}
