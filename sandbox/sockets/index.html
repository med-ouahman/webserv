<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Welcome to the Internet Socket Server!
        <button id="close-btn">
            Close Server
        </button>
    </h1>
    <script>
        const btn = document.getElementById('close-btn');
        btn.addEventSocket('click', () => {
            fetch('/shutdown', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        alert('Server is shutting down...');
                    } else {
                        alert('Failed to shut down the server.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while trying to shut down the server.');
                });
        });
    </script>
</body>
</html>
